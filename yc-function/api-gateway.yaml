openapi: 3.0.0
info:
  title: Audioswipe Yandex Music Proxy
  version: 1.0.0
paths:
  /health:
    get:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: REPLACE_FUNCTION_ID
        tag: "$latest"
      responses:
        "200":
          description: ok
  /ym-api/{proxy+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: proxy
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: REPLACE_FUNCTION_ID
        tag: "$latest"
        payload_format_version: "0.1"
      responses:
        "200":
          description: ok
  /ym-stream/{trackId}:
    get:
      parameters:
        - name: trackId
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: REPLACE_FUNCTION_ID
        tag: "$latest"
        payload_format_version: "0.1"
      responses:
        "302":
          description: redirect to mp3
